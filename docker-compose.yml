version: '3.9'

services:
  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapgames-auth-api
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "Server=sqlserver-auth,1433;Database=fiapgames_auth;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"
      Jwt__Key: "ChaveSuperSecretaFiapGamesEAD12MuitoLongaParaGarantirSeguranca123!"
      Jwt__Issuer: "FiapGamesApi"
      Jwt__Audience: "FiapGamesClients"
    depends_on:
      sqlserver-auth:
        condition: service_healthy
    networks:
      - fiapgames-network

  sqlserver-auth:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-auth-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-auth-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

volumes:
  sqlserver-auth-data:

networks:
  fiapgames-network: