version: '3.9'

services:
  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapgames-auth-api
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthConnection: "Server=sqlserver-auth,1433;Database=fiapgames_auth;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${AUTH_JWT_KEY:?Set AUTH_JWT_KEY}"
      Jwt__Issuer: "FiapGamesApi"
      Jwt__Audience: "FiapGamesClients"
      RabbitMq__HostName: "localhost"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
    depends_on:
      sqlserver-auth:
        condition: service_healthy
    networks:
      - fiapgames-network

  sqlserver-auth:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-auth-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-auth-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

volumes:
  sqlserver-auth-data:

networks:
  fiapgames-network:
