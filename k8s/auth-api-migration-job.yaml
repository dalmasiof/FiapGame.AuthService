apiVersion: batch/v1
kind: Job
metadata:
  name: auth-api-migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: auth-api-migration
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: auth-api
      restartPolicy: Never
      containers:
        - name: auth-api
          image: acrfiapgamesprod64f434dd.azurecr.io/auth-api:bootstrap
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: KeyVaultUri
              value: https://kv-fiapgames-64f434dd.vault.azure.net/
            - name: AZURE_CLIENT_ID
              value: dfff11eb-a350-4ccb-a466-dee3265a9bf1